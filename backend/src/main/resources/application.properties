spring.application.name=transit

# Local dev: file-based H2 in PostgreSQL mode, so no Docker or database install is
# needed (see teaz_pro/docs/TECH_STACK.md). Prod uses Postgres from compose.yml.
spring.datasource.url=jdbc:h2:file:./data/transit-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Errors as RFC 9457 problem details, so the UI can show their "detail".
spring.mvc.problemdetails.enabled=true

# Timetable feed (GTFS zip). Unset = the small sample feed bundled in
# src/main/resources/sample-feed (two made-up lines that run all day, every
# day), so local dev stays offline, like the mock auth. Prod: gtfs.de, see
# application-prod.properties. Any http(s) or file: URL to a GTFS zip works.
transit.gtfs.feed-url=
# When to look for a new feed (Spring cron, in transit.timezone). Only
# downloaded and imported when the server reports a new version.
transit.gtfs.update-cron=0 30 4 * * *

# GTFS-Realtime feed (delays, cancellations). Unset = planned times only.
transit.realtime.url=
