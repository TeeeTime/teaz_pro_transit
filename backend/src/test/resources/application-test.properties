# Tests: an in-memory database per Spring context, with the bundled sample feed, no realtime.
# Combined with "prod" in SecurityConfigTests to test the real security
# rules without Postgres or the network.
spring.datasource.url=jdbc:h2:mem:transit-test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
transit.gtfs.feed-url=
transit.realtime.url=
# Tests import the feed themselves, synchronously (FeedImporter.update).
transit.gtfs.import-on-startup=false
