# Activate with SPRING_PROFILES_ACTIVE=prod.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.teaz.pro/realms/teazpro

# Database: the shared Postgres server on the VPS, database and user "transit".
# Connection only from the environment (.env, see README), never from this file:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# Schema by Flyway (db/migration) as the database's owner.

# All of Germany: local transport, regional and long-distance trains
# (gtfs.de "Germany Full", DELFI e.V., CC BY 4.0). About 250 MB zipped.
transit.gtfs.feed-url=https://download.gtfs.de/germany/free/latest.zip
transit.gtfs.attribution=Timetable: DELFI e.V. via GTFS.de (CC BY 4.0)
# Delays and cancellations for that feed (gtfs.de, CC BY-SA 4.0, beta).
transit.realtime.url=https://realtime.gtfs.de/realtime-free.pb
transit.realtime.attribution=Realtime: GTFS.de (CC BY-SA 4.0)

# Apps allowed to read /api/board from the browser (comma-separated).
transit.cors.allowed-origins=https://portal.teaz.pro
